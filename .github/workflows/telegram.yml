name: polybot Telegram control (listener 24/7)

# Listener interaktif Telegram — DENGERIN command kamu (/status /hunt /agresif
# /kelly /window dll) lalu BALAS. Beda dari hunt.yml yang cuma kirim alert satu
# arah; ini yang bikin bot Telegram bisa jawab tanpa laptop nyala.
#
# Long-polling (getUpdates) butuh proses hidup terus. Job Actions maksimal ~6 jam,
# jadi listener jalan ~5j40m lalu job ini nge-DISPATCH DIRINYA SENDIRI (restart) —
# nyambung terus. `cancel-in-progress` jamin cuma 1 listener hidup (hindari konflik
# getUpdates 409 kalau dua poller jalan barengan).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */5 * * *"   # backup restart (GitHub schedule = best-effort)

permissions:
  actions: write            # buat self re-dispatch (restart diri sendiri)
  contents: write           # buat commit riwayat.csv balik (biar data gak ilang tiap restart)

concurrency:
  group: polybot-telegram
  cancel-in-progress: true  # cuma 1 listener hidup dalam satu waktu

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Boot default PAPER (aman). Live cuma via /live confirm dari Telegram (runtime),
      # dan RESET ke paper tiap restart (~6 jam) — jadi live gak pernah "sticky".
      SIMULASI_MODE: "true"
      LIVE_TRADING_ENABLED: "false"
      MAX_ORDER_SIZE_ABSOLUTE: "5"   # default cap $5/order (bet normal $2.5 lolos). Atur/matiin via /cap
      COPYTRADE_AGGRESSIVE: "true"
      KELLY_ENABLED: "false"
      FLAT_FRAC: "0.5"
      MAX_HARI_KE_RESOLVE: "7"    # 7 hari: biar posisi trader lain kebawa (1 hari = cuma 1 trader yg lolos)
      MAX_ENTRY_PRICE: "0.85"     # skip favorit (harga > 0.85)
      # Balik ke 0.15 (2026-08-13). Perubahan ke 0.50 pada 2 Agu TIDAK LOLOS uji
      # bersih: zona 0.50-0.85 yang diprediksi untung ternyata -$31 di 3.480 bet
      # (t=-0.28). Gak ada alasan mempertahankannya, dan 0.15 bikin volume data
      # ~2x lipat -> kepastian statistik lebih cepat.
      MIN_ENTRY_PRICE: "0.15"
      AGG_MAX_BETS: "25"          # cap IKUT per siklus (dinaikin biar ambil lebih banyak)
      TOP_N_TRADER: "20"          # follow SEMUA yg lolos screening. Urutan by win-rate milih trader nganggur/jangka-panjang, jadi cap sempit = cuma 1 trader nyumbang bet.
      # 7d, bukan 30d. Diukur: 30d -> 6/16 trader punya posisi aktif, 323 posisi,
      # 1 trader dominan 62%. 7d -> 17/20 punya posisi, 888 posisi, dominasi 23%.
      # Trade-off: 7d bisa kepilih trader yg cuma hoki seminggu (30d lebih kebukti).
      # Diterima karena sekarang ADA pelacakan per-trader + /trader block, jadi yg
      # jelek bisa diukur & dibuang — dulu waktu milih 30d, alat itu belum ada.
      LEADERBOARD_WINDOW: "7d"
      ARB_MAX_MARKET: "800"
      ARB_MIN_EDGE_PCT: "5"
      SCANNER_MIN_VOLUME: "50000"
      AUTO_LOOP_MIN: "15"   # loop tiap 15 mnt (hunt cuma ~1-4 mnt, jadi aman). 0=mati
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # POLYBOT_DASHBOARD_URL sengaja DIMATIIN: dashboard sekarang baca riwayat.csv
      # langsung dari GitHub, jadi push per-event mubazir (nyimpen ke blob lama yg gak
      # dibaca). Dulu bikin evaluate bahaya molor (1100 resolusi x POST timeout 5s).
      # POLYBOT_DASHBOARD_URL: ${{ secrets.POLYBOT_DASHBOARD_URL }}
      # wallet buat /live (isi Secrets repo). Kosong = /live nolak otomatis.
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      FUNDER_ADDRESS: ${{ secrets.FUNDER_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests python-dotenv py-clob-client

      - name: Jalankan listener (~5j40m lalu exit buat restart)
        id: listen
        run: |
          START=$(date +%s)
          timeout 340m python -m polybot telegram || true
          echo "elapsed=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Restart diri sendiri (nyambung 24/7)
        if: always()
        run: |
          ELAPSED="${{ steps.listen.outputs.elapsed }}"
          # REM ANTI-RUNAWAY: kalau listener mati cepet (<5 menit) kemungkinan besar
          # config/secret salah — JANGAN restart biar gak spam job tak terhingga.
          # Betulin secret lalu kick manual dari tab Actions.
          if [ "${ELAPSED:-0}" -lt 300 ]; then
            echo "::warning::Listener cuma jalan ${ELAPSED}s — cek TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID. Restart otomatis DITAHAN."
            exit 0
          fi
          echo "Listener jalan ${ELAPSED}s — restart untuk sesi berikutnya."
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/telegram.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
